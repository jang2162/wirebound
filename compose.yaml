# **배포 compose — 앱만(Postgres · 마이그레이션 · api · 입구 web).** TLS · 도메인은 각자의 프록시가 맡고, 그 프록시에 맞춘 차이는
# 서버마다 쓰는 `compose.override.yaml`(커밋하지 않는다)이 갖는다. 절차 · 환경 변수 · override 예 · 잰 값은
# `docs/guides/deploy-docker.md` 가 갖는다. 저장소 뿌리에서 친다:
#
#   cp .env.example .env     # 값을 채운다 — compose 가 뿌리의 .env 를 스스로 읽는다
#   docker compose up -d --build
#
# **개발 DB 는 이 파일이 아니다** — `pnpm db up -d`(`docker/dev/compose.yaml`).
#
# 프로젝트 이름을 고정한다 — 볼륨이 `wirebound-prod_pgdata` 다. 디렉터리에 맡기면 clone 자리 · 디렉터리 이름이 바뀌는 순간 빈 DB 로 뜬다.
name: wirebound-prod

# **배포 값(`.env`)을 둔 자리에서만 돈다** — `down` 도 이 줄을 보간한다. 이름이 고정이라 어느 체크아웃의 뿌리에서 친 맨 `docker compose down -v`
# 도 이 기계의 운영 볼륨에 닿는다 — `env_file` 은 `down` 에서 안 읽히고 `POSTGRES_PASSWORD` 는 셸에 있을 수 있어, 그 둘로는 못 막는다.
x-deploy-guard: ${WIREBOUND_DEPLOY:?.env 에 WIREBOUND_DEPLOY=1 을 적은 배포 자리에서만 친다 — 개발 DB 는 pnpm db up -d}

x-api-image: &api-image
  image: wirebound-api:${WIREBOUND_TAG:-local}
  build:
    context: .
    target: api
  # 레지스트리 이미지가 아니다 — pull 을 건너뛰고 `up` 마다 저장소 코드로 짓는다(Komodo 의 Deploy 가 pull 을 먼저 부른다).
  pull_policy: build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wirebound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 적는다 — 개발 DB 는 pnpm db up -d}
      POSTGRES_DB: wirebound
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 바깥 포트를 열지 않는다 — api 만 compose 네트워크로 붙는다.
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wirebound -d wirebound']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # **마이그레이션 · 최초 계정 — 기동 전에 한 번 돌고 끝난다.** api 는 이것이 종료 0 으로 끝나야 뜬다. api 는 뜰 때 올리지
  # 않고 견주기만 한다 — 뒤처진 DB 면 안 뜬다(`apps/api/src/db/schema-version.ts`). `up` 마다 다시 돌고, 다 올라간 DB 에는
  # 아무것도 안 한다.
  migrate:
    <<: *api-image
    command: ['node', '--import', 'tsx', 'src/db/migrate.ts', 'latest']
    env_file: .env
    environment:
      DATABASE_URL: postgres://wirebound:${POSTGRES_PASSWORD}@postgres:5432/wirebound
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api-image
    env_file: .env
    environment:
      DATABASE_URL: postgres://wirebound:${POSTGRES_PASSWORD}@postgres:5432/wirebound
      # 믿는 앞단은 `web` 하나다 — 아래 `web` 의 고정 주소. 클라이언트 주소는 web 이 고쳐 적어 넘긴다(`docker/web/Caddyfile`).
      TRUST_PROXY: ${EDGE_IP:-10.231.47.2}
      # 시딩 값은 `migrate` 만 읽는다 — api 의 환경에 비밀번호를 남기지 않는다.
      SEED_USER_EMAIL: ''
      SEED_USER_NAME: ''
      SEED_USER_PASSWORD: ''
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      # 요청마다 로그 두 줄이 남는다 — 뜨는 동안만 촘촘히 묻고 그 뒤는 30s 마다.
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    # api 는 SIGTERM 에 도는 요청을 30s 까지 끝까지 답한다(`apps/api/src/shutdown.ts`) — 그보다 길게 둔다. 기본 10s 면 그 뒤가 SIGKILL 이다.
    stop_grace_period: 40s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  # **앱의 입구 — HTTP 하나.** 에디터 정적 번들을 서빙하고 `/api` 를 api 로 넘긴다. TLS 를 끝내지 않는다.
  web:
    image: wirebound-web:${WIREBOUND_TAG:-local}
    build:
      context: .
      target: web
    pull_policy: build
    environment:
      # 앞에 선 프록시의 주소(공백으로 가른 IP · CIDR) — 그 프록시가 적은 `X-Forwarded-For` 를 이어받는다. 비우면 아무도 안 믿고
      # 소켓 주소를 클라이언트 주소로 적는다.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - '${APP_PORT:-8080}:80'
    networks:
      backend:
        ipv4_address: ${EDGE_IP:-10.231.47.2}
    depends_on:
      api:
        condition: service_healthy
    # 입구의 `grace_period`(Caddyfile 35s)보다 길게 — 입구가 먼저 끊으면 api 가 끝까지 답한 pptx 가 사람에게 안 닿는다.
    stop_grace_period: 40s
    restart: unless-stopped
    logging: *logging

networks:
  backend:
    ipam:
      config:
        # `EDGE_IP` 를 고정하려고 대역을 정한다. 서버의 다른 네트워크와 겹치면 `up` 이 죽는다 — 그때 셋을 함께 바꾼다.
        # 기본값은 도커가 스스로 나눠 주는 대역(172.17–31.0.0/16 · 192.168.0.0/16) 밖이다.
        - subnet: ${BACKEND_SUBNET:-10.231.47.0/24}
          # **다른 컨테이너는 이 범위에서만 주소를 받는다** — 없으면 먼저 뜬 postgres 가 `EDGE_IP` 를 가져가 `web` 이
          # «Address already in use» 로 안 뜬다(쟀다). `EDGE_IP` 는 이 범위 밖에 둔다.
          ip_range: ${BACKEND_IP_RANGE:-10.231.47.128/25}

volumes:
  pgdata:
