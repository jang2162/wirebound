# 훅은 lockfile 이 고정한 설치본으로 부른다(`pnpm exec`) — `pnpx` 는 레지스트리 최신본이라 훅끼리 판이 갈린다.

# 고친 파일만 포맷하고 다시 stage 한다. 린트는 포맷이 끝난 뒤에 돈다.
pre-commit:
  jobs:
    - name: fmt
      glob: '*.{js,mjs,cjs,ts,tsx,mts,cts,json}'
      # 두 판 — oxfmt 0.72 는 `page.locator(…).evaluateAll(…)` 사슬을 첫 판 뒤 한 번 더 감싼다(한 판이면 pre-push 의 `--check` 가 빨강). 셋째 판은 아무것도 안 바꾼다.
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files} && pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{js,mjs,cjs,ts,tsx,mts,cts}'
      run: pnpm exec oxlint {staged_files}

# pre-commit 은 커밋이 건드린 파일만 본다 — 병합 · rebase 로 들어온 것과 설정이 바뀐 뒤의 드리프트는 여기서 잡는다.
pre-push:
  jobs:
    - name: fmt-check
      run: pnpm exec oxfmt --check
    - name: lint
      run: pnpm exec oxlint

# 순차 실행이다 — 런타임이 맞은 뒤에 설치가 돌아야 한다. 브랜치 체크아웃(셋째 인자 1)에서만 돈다 — 파일 되돌리기에는 안 돈다.
post-checkout:
  jobs:
    - name: runtime
      run: "[ '{3}' = 1 ] || exit 0; if command -v mise >/dev/null; then mise trust --quiet && mise install; else echo 'mise 가 없어 런타임 버전을 맞추지 못했다'; fi"
    - name: deps
      run: "[ '{3}' = 1 ] || exit 0; pnpm install"
